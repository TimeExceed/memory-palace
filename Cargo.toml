[package]
name = "memory-palace"
version = "0.6.0"
edition = "2024"

[profile.release]
panic = "abort"
strip = "debuginfo"
lto = "thin"

[dependencies]
chrono = "0.4"
clap = { version = "4.6", features = ["cargo", "derive"]}
clap_complete = "4.6"
eframe = "0.37.0"
flexi_logger = "0.31"
log = "0.4"
rand = "0.10.3"
serde = {version = "1.0", features = ["derive"]}
toml = "1.1.8"
